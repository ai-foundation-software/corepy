name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:

# ───────────────── Linux Wheels (CUDA/manylinux) ─────────────────

  linux:
    name: Linux Wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: x86_64
          manylinux: 2_28
          command: build
          # No --interpreter list needed, abi3 builds one generic cp39-abi3 wheel limit
          args: --release --features cuda --out dist --auditwheel skip --manifest-path rust/core/Cargo.toml
          before-script-linux: |
            # 1. Install system dependencies (OpenBLAS and CUDA Toolkit)
            if command -v dnf &> /dev/null; then
              dnf install -y openblas-devel libatomic dnf-plugins-core
              dnf config-manager --add-repo https://developer.download.nvidia.com/compute/cuda/repos/rhel8/x86_64/cuda-rhel8.repo
              dnf install -y cuda-toolkit-12-6
            elif command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y libopenblas-dev nvidia-cuda-toolkit
            fi

            # 2. Setup uv for fast Python toolchain building if needed
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.local/bin:$PATH"

      - name: Install patchelf
        run: sudo apt-get update && sudo apt-get install -y patchelf

      - name: Repair wheels with auditwheel
        run: |
          mkdir -p dist_repaired
          for whl in dist/*.whl; do
            uvx auditwheel repair "$whl" --exclude libcuda.so.1 --plat manylinux_2_28_x86_64 -w dist_repaired
          done
          rm dist/*.whl
          mv dist_repaired/*.whl dist/


      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux
          path: dist/*.whl


# ───────────────── Windows Wheels (CUDA) ─────────────────

  windows:
    name: Windows Wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup CUDA
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: "12.6.0"
          use-github-cache: true

      - name: Setup OpenBLAS
        shell: bash
        run: |
          curl -L -o openblas.zip https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip
          unzip -q openblas.zip -d openblas
          echo "OPENBLAS_DIR=${{ github.workspace }}/openblas" >> $GITHUB_ENV
          echo "${{ github.workspace }}/openblas/bin" >> $GITHUB_PATH

      - name: Build wheel
        shell: bash
        run: |
          uv venv .venv
          source .venv/Scripts/activate
          uv pip install maturin

          # Build one abi3 wheel (py39-none-win_amd64)
          maturin build \
            --release \
            --manifest-path rust/core/Cargo.toml \
            --target x86_64-pc-windows-msvc \
            --out dist \
            --features cuda

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist/*.whl


# ───────────────── macOS Wheels (Metal) ─────────────────

  macos:
    name: macOS Wheel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install OpenBLAS
        run: brew install openblas

      - name: Build wheel
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install maturin

          # Build one abi3 wheel (py39-none-macosx_11_0_arm64)
          maturin build \
            --release \
            --manifest-path rust/core/Cargo.toml \
            --target aarch64-apple-darwin \
            --out dist \
            --features metal

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos
          path: dist/*.whl


# ───────────────── Source Distribution (sdist) ─────────────────

  sdist:
    name: Source Distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          
      - run: uv build --sdist --out-dir dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz


# ───────────────── Publish to PyPI ─────────────────

  publish:
    name: Publish
    needs: [linux, windows, macos, sdist]
    runs-on: ubuntu-latest
    # Only run this on tagged pushes starting with v (e.g., v0.3.0)
    if: startsWith(github.ref, 'refs/tags/v')

    environment:
      name: pypi
      url: https://pypi.org/p/corepy-ai

    permissions:
      id-token: write # Required for trusted publishing (OIDC)

    steps:
      # Download all artifacts into 'dist'
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
