name: Corepy CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: ${{ matrix.os }} / Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "py${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # ========================================
      # STEP 1: Platform Dependencies
      # ========================================

      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openblas
          echo "LIBRARY_PATH=$(brew --prefix openblas)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L -o openblas.zip https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip
          unzip -q openblas.zip -d openblas
          echo "OPENBLAS_DIR=${{ github.workspace }}/openblas" >> $GITHUB_ENV
          echo "${{ github.workspace }}/openblas/bin" >> $GITHUB_PATH

      # ========================================
      # STEP 2: Install Python deps & Build Rust
      # ========================================

      - name: Install Python dependencies
        run: uv sync --all-extras --group dev

      - name: Build Rust extension
        run: uv run maturin develop --release --manifest-path rust/core/Cargo.toml

      - name: Copy BLAS DLLs next to pyd (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # On Python 3.10+, Windows no longer searches PATH for DLL dependencies.
          # We must place BLAS DLLs next to the .pyd OR register directories.
          
          # Find the built .pyd file
          $pyd = Get-ChildItem -Path "corepy" -Filter "_corepy_rust*.pyd" -Recurse | Select-Object -First 1
          if (-not $pyd) {
            # Also check .venv for maturin develop installations
            $pyd = Get-ChildItem -Path ".venv" -Filter "_corepy_rust*.pyd" -Recurse | Select-Object -First 1
          }
          
          if ($pyd) {
            $dest = $pyd.DirectoryName
            Write-Host "Found .pyd at: $($pyd.FullName)"
            
            # Check if MKL was linked (mkl-devel is a dev dependency)
            $venvLibBin = Join-Path ".venv" "Library" "bin"
            if (Test-Path (Join-Path $venvLibBin "mkl_rt.2.dll")) {
              Write-Host "MKL detected in venv - copying MKL DLLs"
              Get-ChildItem -Path $venvLibBin -Filter "mkl_*.dll" | ForEach-Object {
                Copy-Item $_.FullName -Destination $dest
                Write-Host "  Copied $($_.Name)"
              }
              # Also copy tbb DLL if present (MKL dependency)
              Get-ChildItem -Path $venvLibBin -Filter "tbb*.dll" | ForEach-Object {
                Copy-Item $_.FullName -Destination $dest
                Write-Host "  Copied $($_.Name)"
              }
            }
            
            # Also copy OpenBLAS DLL if present
            $openblasDir = $env:OPENBLAS_DIR
            if (-not $openblasDir -and (Test-Path "openblas")) {
              $openblasDir = (Get-Item "openblas").FullName
            }
            if ($openblasDir -and (Test-Path $openblasDir)) {
              $openblasPath = Join-Path $openblasDir "bin" "libopenblas.dll"
              if (Test-Path $openblasPath) {
                Copy-Item $openblasPath -Destination $dest
                Write-Host "Copied libopenblas.dll"
              }
            }
            
            Write-Host "--- DLLs next to .pyd ---"
            Get-ChildItem $dest -Filter "*.dll" | Select-Object Name
          } else {
            Write-Host "ERROR: _corepy_rust*.pyd not found!"
            exit 1
          }

      # ========================================
      # STEP 3: Verify & Test
      # ========================================
      - name: Verify Backend & Import
        run: |
          uv run python -c "import corepy; print(f'corepy {corepy.__version__}')"
          uv run python -c "from corepy import get_backend_policy; print(f'Active Backend: {get_backend_policy()}')"
          uv run python -c "from corepy import _corepy_rust; print('Rust runtime loaded')"

      - name: Run Tests (pytest)
        run: uv run pytest tests/ --cov=corepy --cov-report=term -v

      - name: Functional Smoke Test (Broadcasting & Random)
        run: uv run python scripts/val_smoke.py

      - name: Performance Benchmark Smoke Test
        run: uv run python benchmarks/cpu_matmul_bench.py --size 128


  # ===========================================================================
  # Rust Compile Check (verifies code compiles for all target architectures)
  # ===========================================================================
  rust-check:
    name: Rust Check / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 targets
          - target: x86_64-unknown-linux-gnu
            features: "--features extension-module"
          # ARM64 cross-compile (no execution, just verify compilation)
          - target: aarch64-unknown-linux-gnu
            features: "--features extension-module"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev python3 python3-pip

      - name: Cargo Check (compile only)
        env:
          PYO3_CROSS_PYTHON_VERSION: "3.10"
        run: |
          cargo check --manifest-path rust/core/Cargo.toml --target ${{ matrix.target }} ${{ matrix.features }}

  # ===========================================================================
  # Rust Lints (Clippy)
  # ===========================================================================
  lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev python3 python3-pip

      - name: Clippy
        run: |
          cargo clippy --manifest-path rust/core/Cargo.toml -- -D warnings --allow clippy::missing_safety_doc

  # ===========================================================================
  # Rust Format Check
  # ===========================================================================
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check format
        run: |
          cargo fmt --manifest-path rust/core/Cargo.toml -- --check

