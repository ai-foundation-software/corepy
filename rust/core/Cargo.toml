[package]
name = "corepy-ai"
version = "0.2.6"
edition = "2021"
description = "Rust backend for CorePy - High-performance tensor operations with Metal acceleration"
license = "MIT"
repository = "https://github.com/yourusername/corepy"
homepage = "https://github.com/yourusername/corepy"

[lib]
name = "_corepy_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py39"] }
rayon = "1.8"
num_cpus = "1.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
parking_lot = "0.12"
uuid = { version = "1.0", features = ["v4", "serde"] }
lazy_static = "1.4"
cblas-sys = "0.1.4"

# Platform-specific BLAS backends
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
accelerate-src = "0.3"  # Apple Accelerate framework (AMX support on M1/M2/M3)



[features]
default = ["cpp_kernels"]
cpp_kernels = []
