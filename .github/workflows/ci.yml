name: Corepy CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: ${{ matrix.os }} / Py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "py${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      # ========================================
      # STEP 1: Platform Dependencies
      # ========================================
      - name: Install Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev cmake ninja-build

      - name: Install Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openblas cmake ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)" >> $GITHUB_ENV
          echo "PKG_CONFIG_PATH=$(brew --prefix openblas)/lib/pkgconfig" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix openblas)/lib:$LIBRARY_PATH" >> $GITHUB_ENV

      - name: Install Dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L -o openblas.zip https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip
          unzip -q openblas.zip -d openblas
          echo "OPENBLAS_DIR=${{ github.workspace }}/openblas" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/openblas" >> $GITHUB_ENV
          # Add OpenBLAS bin to PATH so DLLs are found at runtime
          echo "${{ github.workspace }}/openblas/bin" >> $GITHUB_PATH

      # ========================================
      # STEP 2: Build C++ Kernels (csrc/)
      # ========================================
      - name: Build C++ kernels
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            cmake -S csrc -B csrc/build -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S csrc -B csrc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build csrc/build --config Release
          
          if [ "$RUNNER_OS" == "macOS" ]; then
             echo "Compiling Metal Kernels..."
             xcrun -sdk macosx metal -v -c csrc/src/metal/kernels.metal -o csrc/build/kernels.air
             xcrun -sdk macosx metallib csrc/build/kernels.air -o csrc/build/default.metallib
             echo "COREPY_METAL_LIB_PATH=$(pwd)/csrc/build/default.metallib" >> $GITHUB_ENV
          fi

      # ========================================
      # STEP 3: Install Python deps & Build Rust
      # ========================================


      - name: Install dependencies and build Rust extension
        shell: bash
        run: |
          # Install all dev dependencies (includes maturin)
          uv sync --all-extras --group dev
          # Build Rust extension using maturin from the dev environment
          uv run maturin develop --release --manifest-path rust/core/Cargo.toml

      # ========================================
      # STEP 4: Verify & Test
      # ========================================
      - name: Verify Import
        shell: bash
        run: |
          uv run python -c "import corepy; print(f'corepy {corepy.__version__}')"
          uv run python -c "from corepy import _corepy_rust; print('Rust runtime loaded')"

      - name: Run Tests
        shell: bash
        run: |
          uv run pytest tests/ --cov=corepy --cov-report=term -v

  # ===========================================================================
  # Rust Compile Check (verifies code compiles for all target architectures)
  # ===========================================================================
  rust-check:
    name: Rust Check / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # x86_64 targets
          - target: x86_64-unknown-linux-gnu
            features: ""
          # ARM64 cross-compile (no execution, just verify compilation)
          - target: aarch64-unknown-linux-gnu
            features: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Cargo Check (compile only)
        run: |
          cargo check --manifest-path rust/core/Cargo.toml --target ${{ matrix.target }}

  # ===========================================================================
  # Rust Lints (Clippy)
  # ===========================================================================
  lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install OpenBLAS
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev

      - name: Clippy
        run: |
          cargo clippy --manifest-path rust/core/Cargo.toml -- -D warnings --allow clippy::missing_safety_doc

  # ===========================================================================
  # Rust Format Check
  # ===========================================================================
  fmt:
    name: Rust Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check format
        run: |
          cargo fmt --manifest-path rust/core/Cargo.toml -- --check

