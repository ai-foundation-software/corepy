[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "corepy"
version = "0.2.4"
description = "A unified, high-performance core runtime for data, computation, and AI workflows."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
  { name = "Corepy Team", email = "ai.foundation.software@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "typing-extensions>=4.6.0",
    "pydantic==2.12.5",
    "numpy==1.26.4; python_version < '3.13'",
    "numpy>=2.1; python_version >= '3.13'",
    "pybind11==3.0.1",
]

[tool.maturin]
manifest-path = "rust/core/Cargo.toml"
module-name = "corepy._corepy_rust"
python-source = "."

[project.optional-dependencies]

docs = [
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/ai-foundation-software/corepy"
Documentation = "https://github.com/ai-foundation-software/corepy/docs/"
Repository = "https://github.com/ai-foundation-software/corepy.git"
Issues = "https://github.com/ai-foundation-software/corepy/issues"




[tool.coverage.run]
disable_warnings = ["no-ctracer"]
relative_files = true
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=corepy"
testpaths = [
    "tests",

]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B020", "B007", "F841", "E712", "E402", "F811", "R", "F401", "UP", "E701"]

[dependency-groups]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "build",
    "twine",
    "maturin>=1.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=1.3.0",
    "myst-parser>=2.0.0",
    "cmake>=3.15",
    "ninja",
    "pybind11",
    "scikit-build-core>=0.4.3",
    "patchelf>=0.17.2; sys_platform == 'linux'",
]

# UV Configuration
# Fixes maturin + uv cache corruption issue by tracking Rust source changes
# This ensures uv rebuilds when Rust code changes instead of using stale cached versions
[tool.uv]
cache-keys = [
    "pyproject.toml",
    "rust/core/Cargo.toml",
    "rust/core/Cargo.lock",
    "rust/core/build.rs",
    "rust/core/**/*.rs",
]

[tool.uv.sources]
# Ensure corepy is always installed from the local path in development
corepy = { path = ".", editable = true }

