name: Release

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux_build:
    name: Linux / ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          manylinux: auto
          command: build
          args: --release --out dist --interpreter 3.9 3.10 3.11 3.12 3.13
          target: ${{ matrix.target }}
          before-script-linux: |
            if command -v apt-get &> /dev/null; then
              apt-get update && apt-get install -y libopenblas-dev cmake ninja-build
            elif command -v yum &> /dev/null; then
              yum install -y openblas-devel cmake ninja-build
            fi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist/*.whl

  host_build:
    name: ${{ matrix.os }} / ${{ matrix.target }} / ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: "3.9"
            openblas_url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: "3.10"
            openblas_url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: "3.11"
            openblas_url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: "3.12"
            openblas_url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-version: "3.13"
            openblas_url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-x64.zip"
          
          # Windows ARM64 (Experimental - Disabled until OpenBLAS artifacts are verified)
          # - os: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   python-version: "3.11"
          #   openblas_url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-arm64.zip" 
          # - os: windows-latest
          #   target: aarch64-pc-windows-msvc
          #   python-version: "3.12"
          #   openblas_url: "https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28-arm64.zip"

          # macOS ARM64 (Apple Silicon)
          - os: macos-14
            target: aarch64-apple-darwin
            python-version: "3.9"
          - os: macos-14
            target: aarch64-apple-darwin
            python-version: "3.10"
          - os: macos-14
            target: aarch64-apple-darwin
            python-version: "3.11"
          - os: macos-14
            target: aarch64-apple-darwin
            python-version: "3.12"
          - os: macos-14
            target: aarch64-apple-darwin
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-suffix: "py${{ matrix.python-version }}"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # --- Dependencies & C++ Build ---

      - name: Install OpenBLAS & Build C++ (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openblas cmake ninja
          echo "CMAKE_PREFIX_PATH=$(brew --prefix openblas)" >> $GITHUB_ENV
          echo "LIBRARY_PATH=$(brew --prefix openblas)/lib:$LIBRARY_PATH" >> $GITHUB_ENV
          
          # Build C++ Kernels
          echo "Building C++ Kernels..."
          cmake -S csrc -B csrc/build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build csrc/build --config Release

          # Build Metal Kernels
          echo "Compiling Metal Kernels..."
          xcrun -sdk macosx metal -v -c csrc/src/metal/kernels.metal -o csrc/build/kernels.air
          xcrun -sdk macosx metallib csrc/build/kernels.air -o csrc/build/default.metallib
          # Place metallib where package can find it
          cp csrc/build/default.metallib corepy/default.metallib

      - name: Install OpenBLAS & Build C++ (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -L -o openblas.zip ${{ matrix.openblas_url }}
          unzip -q openblas.zip -d openblas
          echo "OPENBLAS_DIR=${{ github.workspace }}/openblas" >> $GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=${{ github.workspace }}/openblas" >> $GITHUB_ENV
          echo "${{ github.workspace }}/openblas/bin" >> $GITHUB_PATH

          # Build C++ Kernels
          # Note: CMake determines target arch from generator or environment.
          # For cross-compiling to ARM64 on x64 host, we might need specific flags.
          echo "Building C++ Kernels..."
          if [[ "${{ matrix.target }}" == "aarch64-pc-windows-msvc" ]]; then
            # Attempt to configure for ARM64. 
            # This is optimistic; usually requires -A ARM64 with Visual Studio generator
            cmake -S csrc -B csrc/build -A ARM64 -DCMAKE_BUILD_TYPE=Release
          else
            cmake -S csrc -B csrc/build -DCMAKE_BUILD_TYPE=Release
          fi
          cmake --build csrc/build --config Release

      - name: Build Wheels with uv
        shell: bash
        run: |
          uv sync --all-extras --group dev
          # Use the Python from uv's venv
          if [ "$RUNNER_OS" == "Windows" ]; then
            uv run maturin build --release --out dist --manifest-path rust/core/Cargo.toml --target ${{ matrix.target }} --interpreter .venv/Scripts/python.exe
          else
            uv run maturin build --release --out dist --manifest-path rust/core/Cargo.toml --target ${{ matrix.target }} --interpreter .venv/bin/python
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/*.whl

  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [linux_build, host_build, build_sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/corepy
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
